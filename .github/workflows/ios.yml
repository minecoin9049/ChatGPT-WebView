name: Build iOS app
on:
  push:
    paths: ['Compat/**', 'Tests/**', 'scripts/**', 'project.yml', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test offline extraction
        run: node Tests/mobile.cjs
      - name: Test cache limits and expiry
        run: |
          swiftc Compat/ChatCache.swift Tests/main.swift -o /tmp/chat-cache-tests
          /tmp/chat-cache-tests
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iOS 16 device app
        run: xcodebuild -project ChatGPTCompat.xcodeproj -scheme ChatGPTCompat -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Restore original icon and verify package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPTCompat-0.3-build3
          path: ChatGPTCompat-0.3.ipa
          if-no-files-found: error
          retention-days: 14
