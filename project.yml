name: ChatGPTCompat
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ChatGPTCompat:
    type: application
    platform: iOS
    sources:
      - path: Compat
        excludes: [Mobile.js]
      - path: Compat/Mobile.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minecoin9049.chatgptcompat
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access for voice input"
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access for image uploads"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
